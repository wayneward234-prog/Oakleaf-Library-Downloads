name: Public Android version history

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_public_history.py'
      - '.github/workflows/public-history.yml'

permissions:
  contents: write

concurrency:
  group: oakleaf-public-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the public downloads repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Rebuild history from published APK releases only
        run: python3 scripts/update_public_history.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save changes if a release is new or edited
        shell: bash
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Public version history already current.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update public Oakleaf Android version history'
          git pull --rebase origin main
          git push origin HEAD:main
